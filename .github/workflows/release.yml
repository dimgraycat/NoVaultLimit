name: Build Release Assets

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  build-and-upload:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate tag version
        id: version
        run: |
          tag="${GITHUB_REF_NAME}"
          mod_version="$(sed -n 's/^mod_version=//p' gradle.properties)"
          normalized_tag="${tag#v}"
          release_version="${mod_version##*-r-}"

          if [ "$normalized_tag" != "$release_version" ]; then
            echo "Tag version ($tag) does not match release version ($release_version) from mod_version ($mod_version)"
            exit 1
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Build release artifacts
        run: ./gradlew build

      - name: Create GitHub Release if missing
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 || \
          gh release create "$RELEASE_TAG" --title "$RELEASE_TAG" --generate-notes

      - name: Upload jars to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          shopt -s nullglob
          files=(build/libs/*.jar)

          if [ ${#files[@]} -eq 0 ]; then
            echo "No jars found in build/libs"
            exit 1
          fi

          gh release upload "$RELEASE_TAG" "${files[@]}" --clobber
